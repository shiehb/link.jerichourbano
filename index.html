  <!-- Decipher Intro + Glitch Animation Script -->
  <script>
    const profileElement = document.getElementById('profileName');
    const baseText = "JERICHO URBANO";
    
    // Characters used during the random deciphering intro phase
    const cipherChars = "!@#$%^&*()_+-=[]{}|;:,.<>?/0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";

    // Subtle leet/glyph map for the ongoing glitch effect
    const charMap = {
      'E': ['3', 'Σ', '€'],
      'R': ['Я'],
      'I': ['1'],
      'C': ['<'],
      'H': ['#', 'Ħ'],
      'O': ['0', 'Ő', 'Ø'],
      'A': ['4', '@', 'Δ'],
      'N': ['И', 'Ŋ']
    };

    // --- PHASE 1: DECIPHER INTRO ANIMATION ---
    let iteration = 0;
    const totalSteps = baseText.length * 3;

    const decipherInterval = setInterval(() => {
      const output = baseText
        .split('')
        .map((char, index) => {
          if (char === ' ') return ' ';
          if (index < iteration / 3) {
            return char;
          }
          return cipherChars[Math.floor(Math.random() * cipherChars.length)];
        })
        .join('');

      profileElement.textContent = output;

      iteration++;

      if (iteration > totalSteps) {
        clearInterval(decipherInterval);
        profileElement.textContent = baseText;
        startGlitchLoop();
      }
    }, 40);

    // --- PHASE 2: ONGOING GLITCH LOOP ---
    function startGlitchLoop() {
      setInterval(() => {
        const eligibleIndices = [];
        baseText.split('').forEach((char, index) => {
          if (charMap[char]) {
            eligibleIndices.push(index);
          }
        });

        const countToChange = Math.random() < 0.5 ? 1 : 2;
        const shuffledIndices = [...eligibleIndices].sort(() => 0.5 - Math.random());
        const selectedIndices = shuffledIndices.slice(0, countToChange);

        const glitchedChars = baseText.split('');
        selectedIndices.forEach(index => {
          const originalChar = baseText[index];
          const options = charMap[originalChar];
          glitchedChars[index] = options[Math.floor(Math.random() * options.length)];
        });

        profileElement.textContent = glitchedChars.join('');

        setTimeout(() => {
          profileElement.textContent = baseText;
        }, 800);

      }, 2500);
    }
  </script>
